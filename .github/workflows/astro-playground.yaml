name: Deploy to GitHub Pages(Astro Playground)

on:
  push:
    branches:
      - main
    paths:
      - apps/astro-playground/**
      - .github/workflows/astro-playground.yaml
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm --filter astro-playground install

      - name: Astro build
        env:
          BASE_PATH: /showroom/astro-playground/
        run: pnpm run astro:build

      - name: Deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/astro-playground/dist
          destination_dir: astro-playground
