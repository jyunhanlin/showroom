name: Deploy to GitHub Pages(Next.js Playground)

on:
  push:
    branches:
      - main
    paths:
      - apps/nextjs-playground/**
      - .github/workflows/nextjs-playground.yaml
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm --filter nextjs-playground install

      - name: Next export
        run: pnpm run next:build

      - name: Deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/nextjs-playground/out
          destination_dir: nextjs-playground
