name: Deploy to GitHub Pages(TanStack Playground)

on:
  push:
    branches:
      - main
    paths:
      - apps/tanstack-playground/**
      - .github/workflows/tanstack-playground.yaml
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm --filter tanstack-playground install

      - name: Build SPA
        env:
          BASE_PATH: /showroom/tanstack-playground/
        run: pnpm run tanstack:build

      - name: Deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/tanstack-playground/.output/public
          destination_dir: tanstack-playground
